    // 遊戲狀態變數
    let clearedDepts = new Set();
    let score = 0;
    let currentDeptIndex = null;
    let audioCtx = null;

    // Web Audio API 音效
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playCorrectSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.3);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.4);
      } catch (e) { console.log(e); }
    }

    function playWrongSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);

        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.2);
      } catch (e) { console.log(e); }
    }

    function triggerGoldShower() {
      var duration = 4 * 1000;
      var end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 7,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: ['#d4af37', '#ffd700', '#8b0000', '#ffffff']
        });
        confetti({
          particleCount: 7,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: ['#d4af37', '#ffd700', '#8b0000', '#ffffff']
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      })();
    }

    function initGame() {
      const grid = document.getElementById("dept-grid");
      grid.innerHTML = "";

      departmentsData.forEach((dept, index) => {
        const card = document.createElement("div");
        card.className = "dept-card";
        card.id = `card-${index}`;
        card.onclick = () => openModal(index);

        card.innerHTML = `
          <div class="dept-number">第 ${index + 1} 司</div>
          <div class="dept-name">${dept.name}</div>
        `;
        grid.appendChild(card);
      });

      updateStats();
    }

    function updateStats() {
      document.getElementById("cleared-count").innerText = clearedDepts.size;
      document.getElementById("score").innerText = score;
    }

    function openModal(index) {
      currentDeptIndex = index;
      const dept = departmentsData[index];

      document.getElementById("modal-dept-name").innerText = `${dept.name}（${dept.desc}）`;
      document.getElementById("modal-dialogue").innerText = dept.dialogue;
      document.getElementById("modal-question").innerText = `【考題】${dept.question}`;
      
      const optionsContainer = document.getElementById("modal-options");
      optionsContainer.innerHTML = "";

      dept.options.forEach((opt, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = `${String.fromCharCode(65 + optIdx)}. ${opt}`;
        btn.onclick = () => checkAnswer(optIdx);
        optionsContainer.appendChild(btn);
      });

      document.getElementById("modal").classList.add("active");
    }

    function checkAnswer(selectedIndex) {
      const dept = departmentsData[currentDeptIndex];
      const resultOverlay = document.getElementById("result-overlay");
      const resultCard = document.getElementById("result-card");
      const resultTitle = document.getElementById("result-title");
      const resultExplanation = document.getElementById("result-explanation");
      const actionBtn = document.getElementById("result-action-btn");

      if (selectedIndex === dept.answer) {
        playCorrectSound();
        
        // 增加分數與標記過關
        if (!clearedDepts.has(currentDeptIndex)) {
          clearedDepts.add(currentDeptIndex);
          score += 100;
          document.getElementById(`card-${currentDeptIndex}`).classList.add("cleared");
          updateStats();
        }

        resultCard.className = "result-card correct";
        resultTitle.innerText = "🎉 恭喜答對！";
        resultExplanation.innerHTML = `<b>【典故解析】</b><br>${dept.explanation}`;

        if (clearedDepts.size === departmentsData.length) {
          actionBtn.className = "action-btn next-btn";
          actionBtn.innerText = "🏆 圓滿通關！領取功德錦囊 ➔";
          actionBtn.onclick = () => {
            closeResultOverlay();
            closeModal();
            triggerGoldShower();
            document.getElementById("final-overlay").classList.add("active");
          };
        } else {
          actionBtn.className = "action-btn next-btn";
          actionBtn.innerText = "繼續挑戰下一關 ➔";
          actionBtn.onclick = () => {
            closeResultOverlay();
            goToNextStage();
          };
        }

      } else {
        playWrongSound();
        
        resultCard.className = "result-card wrong";
        resultTitle.innerText = "❌ 答錯囉！請再試一次！";
        resultExplanation.innerText = "仔細閱讀司官指示與考題涵義，重新思考看看喔！";

        actionBtn.className = "action-btn retry-btn";
        actionBtn.innerText = "🔄 再試一次";
        actionBtn.onclick = closeResultOverlay;
      }

      resultOverlay.classList.add("active");
    }

    function closeResultOverlay() {
      document.getElementById("result-overlay").classList.remove("active");
    }

    function closeFinalOverlay() {
      document.getElementById("final-overlay").classList.remove("active");
    }

    function goToNextStage() {
      let nextIndex = (currentDeptIndex + 1) % departmentsData.length;
      for (let i = 0; i < departmentsData.length; i++) {
        let checkIdx = (currentDeptIndex + 1 + i) % departmentsData.length;
        if (!clearedDepts.has(checkIdx)) {
          nextIndex = checkIdx;
          break;
        }
      }
      openModal(nextIndex);
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("active");
    }

    window.onload = initGame;
  </script>
